name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: ${{ matrix.os }} / cargo ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [check, test]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        if: matrix.profile == 'check'
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        if: matrix.profile == 'check'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt
        if: matrix.profile == 'check' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo test (no-GPU lanes)
        if: matrix.profile == 'test'
        # The GPU-touching tests are gated by submodule presence; on CI runners
        # without GPU access we still exercise oidn-tza, oidn-model, color, tile.
        run: cargo test --workspace --release

      - name: cargo doc
        if: matrix.profile == 'check' && matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
