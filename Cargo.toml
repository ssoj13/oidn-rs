[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.85"
license       = "Apache-2.0"
authors       = ["oidn-rs contributors"]
repository    = "https://github.com/ssoj13/oidn-rs"
homepage      = "https://github.com/ssoj13/oidn-rs"
documentation = "https://docs.rs/oidn-rs"
keywords      = ["denoising", "raytracing", "graphics", "wgpu", "burn"]
categories    = ["graphics", "multimedia::images", "science"]
readme        = "../../README.md"
description   = "Pure Rust port of Intel Open Image Denoise on Burn + wgpu"

[workspace.dependencies]
# ML
# burn is a GIT dep (not crates.io): the wgpu-30 world needs burn's wgpu backend on cubecl main
# (= wgpu 30). Published burn 0.21 hard-pins cubecl-wgpu 0.10 = wgpu 29, which would split the lock.
# A [patch] cannot cross 0.21→0.22 (minor bump), so this is a direct git dep. The wgpu backend is
# pulled via burn's `wgpu` feature (see oidn-rs crate), NOT a separate burn-wgpu dep. cubecl is left
# transitive: oidn has ZERO #[cube] kernels, so it never names cubecl directly and burn's own pinned
# cubecl rev (31c5506c, matching this burn rev) stays the single cubecl in the graph. When bumping
# burn, keep both revs in lockstep with gsplat-rs (see colmap-rs migration notes).
burn         = { git = "https://github.com/tracel-ai/burn", rev = "93e63e8e9cf215ffb870ed62132961588a774096", default-features = false, features = ["std", "ndarray"] }

# math / data
half         = { version = "2", features = ["bytemuck"] }
bytemuck     = { version = "1", features = ["derive"] }

# infra
thiserror    = "2"
tracing      = "0.1"
memmap2      = "0.9"

# CLI-only
clap         = { version = "4", features = ["derive"] }
exr          = "1"
image        = "0.25"

# dev
approx       = "0.5"

[profile.release]
opt-level = 3
debug     = false

[profile.dev]
opt-level = 1
