[package]
name          = "oidn-rs"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
readme        = { workspace = true }
keywords      = ["denoising", "raytracing", "graphics", "wgpu", "burn"]
categories    = ["graphics", "multimedia::images", "science"]
description   = "Pure Rust port of Intel Open Image Denoise on Burn + wgpu"

[lib]
path = "src/lib.rs"

# Each `embed-*` feature bakes a slice of the reference TZA blobs from
# `data/weights/` into the library via `include_bytes!`. See
# `src/weights.rs` for the per-feature stem list and approximate sizes.
# A default build embeds nothing — consumers opt in to exactly the
# subsets their renderer needs.
[features]
default = []
embed-hdr = []
embed-ldr = []
embed-aov = []
embed-aux-clean = []
embed-lightmap = []
embed-all = [
    "embed-hdr",
    "embed-ldr",
    "embed-aov",
    "embed-aux-clean",
    "embed-lightmap",
]

[dependencies]
oidn-tza   = { path = "../oidn-tza",   version = "0.1.0" }
oidn-model = { path = "../oidn-model", version = "0.1.0" }
burn       = { workspace = true }
burn-wgpu  = { workspace = true }
half       = { workspace = true }
bytemuck   = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
memmap2    = { workspace = true }
# `log` macros are used by the temporary debug-trace in `unet_runner.rs`
# (added to diagnose the all-zero-output bug). Squarebob's `env_logger`
# picks them up directly.
log        = "0.4"
